version: 2

builds:
  - main: ./multirun.go
    binary: multirun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - repository:
      owner: ericfialkowski
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ericfialkowski/multirun
    description: Run multiple commands concurrently
    # The release binaries are unsigned, so Gatekeeper kills them unless the
    # quarantine attribute is cleared on install. `system_command` is `run!`
    # (must-succeed), and /usr/bin/xattr does not exist on Linux, so the call
    # has to be guarded or the cask fails to install under Linuxbrew.
    #
    # This emits Homebrew's deprecated `postflight` stanza, which warns on every
    # `brew` command touching the cask. GoReleaser cannot emit the replacement
    # `postflight_steps` yet; support is pending in goreleaser#6873. Once that
    # ships, replace the block below with:
    #
    #     hooks:
    #       post:
    #         install_steps: |
    #           on_macos do
    #             run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/multirun"]
    #           end
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/multirun"]
          end
